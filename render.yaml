# Render Blueprint: creates the web service and its PostgreSQL database together.
# If your existing Web Service has a different name, change the `name` below to
# that exact name so Render can manage the existing service instead of duplicating it.
services:
  - type: web
    name: intercambio-navideno
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intercambio-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: intercambio-db
    plan: free
